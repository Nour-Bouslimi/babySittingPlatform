
<!-- Page Header Start -->
<div class="container-fluid page-header py-5 wow fadeIn" data-wow-delay="0.1s">
  <div class="container text-center py-5">
    <h1 class="display-2 text-white mb-4">My Reservations</h1>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a routerLink="/home">Home</a ></li>
        <li class="breadcrumb-item text-white" aria-current="page">My Reservations</li>
      </ol>
    </nav>
  </div>
</div>
<!-- Page Header End -->

<div class="container mt-5">

  <div class="row g-4 justify-content-center">
    <div *ngFor="let res of reservations" class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4">
        <button
          class="btn btn-sm btn-outline-danger position-absolute top-0 end-0 m-2"
          (click)="deleteReservation(res.idReserv)"
        >
          🗑️
        </button>
        <div  class="card-body d-flex align-items-center p-4">
          <img
            [src]="'http://localhost:8081/user/displayImage/' + res.nounou.photo"
            alt="Nanny photo"
            class="rounded-circle border border-3 border-primary me-4"
            style="width: 80px; height: 80px; object-fit: cover;"
          />

          <div class="flex-grow-1">
            <h5 class="mb-1">{{ res.nounou.firstName }} {{ res.nounou.lastName }}</h5>
            <p class="mb-1 text-muted">
              📅 {{ res.date }} <br />
              🕒 {{ res.heureDebut }}h - {{ res.heureFin }}h
            </p>
            <span class="badge px-3 py-2 rounded-pill"
                  [ngClass]="{
                    'bg-secondary text-white': res.statut === 'PENDING',
                    'bg-success text-white': res.statut === 'ACCEPTED',
                    'bg-danger text-white': res.statut === 'REJECTED'
                  }">
              {{ res.statut }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
