<!-- Page Header Start -->
<div class="container-fluid page-header py-5 wow fadeIn" data-wow-delay="0.1s">
  <div class="container text-center py-5">
    <h1 class="display-2 text-white mb-4">Create Your Announcement</h1>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a routerLink="/home">Home</a ></li>
        <li class="breadcrumb-item text-white" aria-current="page">Create Announcement</li>
      </ol>
    </nav>
  </div>
</div>
<!-- Page Header End -->

<!-- create announce Start -->
<div class="container-fluid py-5" style="background-color: #fce4ec;">
  <div class="container py-5 text-center">
    <form class="p-5 bg-light rounded" method="post" enctype="multipart/form-data">
      <div class="p-5 bg-light rounded">
        <div class="mx-auto text-center wow fadeIn" data-wow-delay="0.1s" style="max-width: 700px;">
          <h4 class="text-primary mb-4 border-bottom border-primary border-2 d-inline-block p-2 title-border-radius">Create Your Announcement</h4>
          <h3 class="display-3" style="font-size: 34px;">Looking for help with your little ones? </h3>
          <p class="mb-5"> Post your announcement and connect with caring babysitters near you.</p>
        </div>

        <!-- Titre et Description centrés avec la même largeur que le bouton -->
        <div class="row justify-content-center">
          <div class="col-12">
            <div class="mb-3">
              <input type="text" class="form-control border-0 shadow-sm p-3" placeholder="Title" style="max-width: 600px; width: 100%; margin: 0 auto; background-color: #fff; border-radius: 10px; border: 2px solid #ff4081;">
            </div>
            <div class="mb-3">
              <textarea class="form-control border-0 shadow-sm p-3" placeholder="Description" style="max-width: 600px; width: 100%; margin: 0 auto; background-color: #fff; border-radius: 10px; border: 2px solid #ff4081; min-height: 100px;"></textarea>
            </div>
            <div class="mt-4">
              <button class="btn btn-primary text-white py-3" style="max-width: 600px; width: 100%; border-radius: 10px;" type="submit">Create</button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<!-- create announce End -->
