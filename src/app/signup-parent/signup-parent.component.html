<!-- Page Header Start -->
<div class="container-fluid page-header py-5 wow fadeIn" data-wow-delay="0.1s">
  <div class="container text-center py-5">
    <h1 class="display-2 text-white mb-4">SignUp Parent</h1>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a routerLink="/home">Home</a ></li>
        <li class="breadcrumb-item text-white" aria-current="page">Signup Parent</li>
      </ol>
    </nav>
  </div>
</div>
<!-- Page Header End -->


<!-- signup Start -->
<div class="container-fluid py-5">
  <div class="container py-5">
    <form class="p-5 bg-light rounded" method="post" enctype="multipart/form-data">
      <div class="p-5 bg-light rounded">
        <div class="mx-auto text-center wow fadeIn" data-wow-delay="0.1s" style="max-width: 700px;">
          <h4 class="text-primary mb-4 border-bottom border-primary border-2 d-inline-block p-2 title-border-radius">Get Started Now</h4>
          <h3 class="display-3" style="font-size: 34px;">Looking for a caring babysitter?</h3>
          <p class="mb-5"> Create your account and connect with trusted childcare providers nearby.</p>
        </div>

        <div class="row g-5 mb-5">
          <!--address-->
          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.1s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">
              <i class="fas fa-map-marker-alt fa-2x text-primary me-4"></i>
              <input type="text" class="form-control border-0 shadow-none" placeholder="Address" style="background:transparent; min-height: 5px;">
            </div>
          </div>
          <!--email-->
          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.3s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">
              <i class="fas fa-envelope fa-2x text-primary me-4"></i>
              <input type="email" class="form-control border-0 shadow-none" placeholder="Email" style="background:transparent; min-height: 5px;">
            </div>
          </div>
          <!--telephone-->
          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.5s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">
              <i class="fa fa-phone-alt fa-2x text-primary me-4"></i>
              <input type="tel" class="form-control border-0 shadow-none" placeholder="Phone Number" style="background:transparent; min-height: 5px;">
            </div>
          </div>

        </div>


        <div class="row g-5 mb-5">
          <!-- Genre (Sexe) -->
          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.1s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 48px;">
              <i class="fa fa-venus-mars fa-2x text-primary me-4"></i>
              <div class="form-check form-check-inline mb-0">
                <input class="form-check-input" type="radio" name="genre" id="genreF" value="F">
                <label class="form-check-label" for="genreF">Female</label>
              </div>
              <div class="form-check form-check-inline mb-0 ms-3">
                <input class="form-check-input" type="radio" name="genre" id="genreM" value="M">
                <label class="form-check-label" for="genreM">Male</label>
              </div>
            </div>
          </div>
          <!-- Date de naissance -->
          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.3s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 48px;">
              <i class="fa fa-calendar-alt fa-2x text-primary me-4"></i>
              <input type="date" class="form-control border-0 shadow-none" placeholder="Date de naissance" style="background:transparent; min-height: 40px;">
            </div>
          </div>
          <!-- Ages des enfants (multi-select) -->

          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.5s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 48px; position:relative;">
              <i class="fa fa-child fa-2x text-primary me-4"></i>
              <div style="width:100%;">
                <button type="button" id="toggleAgeDropdown" class="form-control border-0 shadow-none text-start" style="background:transparent; min-height:40px;">
                  Child's Age <i class="fa fa-caret-down float-end"></i>
                </button>
                <div id="ageDropdownList" class="border rounded bg-white mt-1" style="display:none; position:absolute; left:55px; right:10px; z-index:10;">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="0-1" id="age0_1">
                    <label class="form-check-label" for="age0_1">0-1 year</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="1-3" id="age1_3">
                    <label class="form-check-label" for="age1_3">1-3 year</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="3-6" id="age3_6">
                    <label class="form-check-label" for="age3_6">3-6 year</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="6-10" id="age6_10">
                    <label class="form-check-label" for="age6_10">6-10 year</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="10+" id="age10plus">
                    <label class="form-check-label" for="age10plus">10 year and more</label>
                  </div>
                </div>
              </div>
            </div>
          </div>


        </div>
        <div class="row g-5 mb-5">
          <!-- Number of children -->

          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.5s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">
              <i class="fa fa-child fa-2x text-primary me-4"></i>
              <input type="tel" class="form-control border-0 shadow-none" placeholder="Number of children" style="background:transparent; min-height: 5px;">
            </div>
          </div>
          <!-- First Name -->

          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.5s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">

              <input type="text" class="form-control border-0 shadow-none" placeholder="First Name" style="background:transparent; min-height: 5px;">
            </div>
          </div>


          <!-- Last Name -->

          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.5s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">

              <input type="text" class="form-control border-0 shadow-none" placeholder="Last Name" style="background:transparent; min-height: 5px;">
            </div>
          </div>


        </div>

        <!-- Password -->

        <div class="row g-5 mb-5">


          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.5s">
            <div class="d-flex align-items-center w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">

              <input  id="passwordInput" type="password" class="form-control border-0 shadow-none" placeholder="Password" style="background:transparent; min-height: 5px;">
              <span id="togglePassword" style="position:absolute;  right:1000px; ">
                                    <i class="fa fa-eye-slash" id="eyeIcon"></i>
                                </span>
            </div>

          </div>

          <div class="col-lg-4 wow fadeIn" data-wow-delay="0.5s">
            <div class="d-flex flex-column align-items-start w-100 border border-primary p-2 rounded bg-white" style="min-height: 5px;">
              <label for="userImage" class="mb-2">User Image</label>
              <input type="file" id="userImage" accept="image/*" class="form-control border-0 shadow-none" style="background:transparent; min-height: 5px;">
              <img id="previewImage" src="" alt="Preview" style="display:none; max-width:100px; margin-top:10px;"/>
              <input type="hidden" id="userImageBase64" name="userImageBase64">
            </div>
          </div>



        </div>




        <div class="row g-5">
          <div class="col-lg-12 d-flex justify-content-center wow fadeIn" data-wow-delay="0.3s">
            <button class="btn btn-primary form-control py-3 border-primary text-white bg-primary" style="max-width:600px;" type="submit">Signup</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
<!-- signup End -->
